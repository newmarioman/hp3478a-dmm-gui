[project]
name = "hp3478-dmm-gui"
dynamic = ["version"]
description = "Python HP 3478A DMM GUI"
authors = [
    { name = "Lorenzo Mariani", email = "newmarioman@hotmail.it" },
]

license = "MIT"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]